        :root {
            --bg-color: #F9F7F2;
            --card-bg: #FFFFFF;

            --gold-accent: #C5A059;

            --border-color: #E8E4D9;

            --sirah-color: #7A3B3B;      /* Deep Auburn/Burgundy */
            --sirah-bg: #FBF4F4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);

        }

        .container {

            max-width: 520px;
            margin: 0 auto;
        }

        header {

            margin-bottom: 32px;
            padding: 24px 16px 16px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-logo {
            width: 130px;
            height: auto;
            margin-bottom: 12px;
            mix-blend-mode: multiply;
            filter: contrast(105%);

            font-size: 20px;
            margin-bottom: 8px;
            letter-spacing: 4px;
        }

            font-size: 28px;
            font-weight: 700;
            color: #1A3323;
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--gold-accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

            margin: 14px auto 0;
        }
