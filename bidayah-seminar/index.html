<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بداية - Bidayah</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
            font-size: 28px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }
        .day-section {
            margin-bottom: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-right: 5px solid #2563eb;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .day-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .title-ar {
            font-size: 20px;
            font-weight: bold;
            color: #1e293b;
        }
        .title-de {
            font-size: 16px;
            color: #64748b;
            font-weight: 600;
            direction: ltr;
            text-align: right;
        }
        .pdf-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .pdf-button:hover {
            background-color: #1d4ed8;
        }
        .pdf-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>جدول المحاضرات | Seminarplan</h1>

    <div class="day-section">
        <div class="day-title">
            <span class="title-ar">اليوم الأول</span>
            <span class="title-de">Tag 1</span>
        </div>
        <a href="day1.pdf" class="pdf-button" target="_blank">
            <svg class="pdf-icon" viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9.5 8.5c0 .8-.7 1.5-1.5 1.5H7v2H5.5V9H8c.8 0 1.5.7 1.5 1.5v1zm5 2c0 .8-.7 1.5-1.5 1.5h-2.5V9H13c.8 0 1.5.7 1.5 1.5v3zm4-3h-2v1h1.5V13H16v2h-1.5V9H18.5v1.5z"/>
            </svg>
            تحميل PDF / Download
        </a>
    </div>

    <div class="day-section">
        <div class="day-title">
            <span class="title-ar">اليوم الثاني</span>
            <span class="title-de">Tag 2</span>
        </div>
        <a href="day2.pdf" class="pdf-button" target="_blank">
            <svg class="pdf-icon" viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9.5 8.5c0 .8-.7 1.5-1.5 1.5H7v2H5.5V9H8c.8 0 1.5.7 1.5 1.5v1zm5 2c0 .8-.7 1.5-1.5 1.5h-2.5V9H13c.8 0 1.5.7 1.5 1.5v3zm4-3h-2v1h1.5V13H16v2h-1.5V9H18.5v1.5z"/>
            </svg>
            تحميل PDF / Download
        </a>
    </div>

    <div class="day-section">
        <div class="day-title">
            <span class="title-ar">اليوم الثالث</span>
            <span class="title-de">Tag 3</span>
        </div>
        <a href="day3.pdf" class="pdf-button" target="_blank">
            <svg class="pdf-icon" viewBox="0 0 24 24">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9.5 8.5c0 .8-.7 1.5-1.5 1.5H7v2H5.5V9H8c.8 0 1.5.7 1.5 1.5v1zm5 2c0 .8-.7 1.5-1.5 1.5h-2.5V9H13c.8 0 1.5.7 1.5 1.5v3zm4-3h-2v1h1.5V13H16v2h-1.5V9H18.5v1.5z"/>
            </svg>
            تحميل PDF / Download
        </a>
    </div>

</div>

</body>
</html>
